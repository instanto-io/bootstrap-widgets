name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Maven build and showcase compile
    # GitHub withholds package credentials from fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Maven for private package repositories
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>forgejo-instanto</id>
                <username>${env.FORGEJO_PACKAGE_USER}</username>
                <password>${env.FORGEJO_PACKAGE_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and install reactor artifacts including all tests
        run: mvn -B -U clean install

      - name: Export browser coverage against shared Java sources
        run: |
          java build-tools/BrowserCoverage.java --self-test
          java build-tools/BrowserCoverage.java

      - name: Upload JVM and browser coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/jacoco.exec
            **/target/teavm-coverage.xml*
            target/browser-coverage.xml
            target/browser-coverage-unmapped.txt
          if-no-files-found: error

      - name: Upload test results including unfinished specifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-results
          path: '**/target/surefire-reports/*'
          if-no-files-found: warn
          retention-days: 7

      - name: Compile showcase with GWT
        run: mvn -B -f gwt/gwt-bootstrap3-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Compile Bootstrap 3 browser fixtures with GWT
        run: mvn -B -f gwt/gwt-bootstrap3-browser-fixtures/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Compile Bootstrap 5 showcase with GWT
        run: mvn -B -f gwt/gwt-bootstrap5-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Compile Bootstrap 5 browser fixtures with GWT
        run: mvn -B -f gwt/gwt-bootstrap5-browser-fixtures/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      # Packaging each application prepares and checks its source maps; required here,
      # because the GWT compile above means every map must be present.
      - name: Assemble verified showcase site
        run: mvn -B -pl showcase-site -am -DskipTests -Dsource.maps.flag=--required package

      - name: Smoke-test assembled showcases in Chromium
        run: bash scripts/smoke-showcase-pages.sh

      - name: Exercise compiled showcase navigation in Java
        run: mvn -B -f testing/showcase-browser-tests/pom.xml test

      - name: Upload showcase navigation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-navigation-results
          path: testing/showcase-browser-tests/target/surefire-reports/*
          if-no-files-found: warn

      - name: Exercise date pickers in all four compiled showcases
        run: |
          node scripts/run-datepicker-tests.mjs
          BROWSER_TEST_TIMEZONE=America/Los_Angeles node scripts/run-datepicker-tests.mjs

      - name: Compare GWT and TeaVM showcase layouts on desktop and mobile
        run: node scripts/run-showcase-layout-tests.mjs

      - name: Exercise compiled GWT widgets with mobile touch input
        run: node scripts/run-browser-behaviour-tests.mjs

      - name: SonarQube Quality Gate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.instanto.io
        run: |
          set -euo pipefail
          : "${SONAR_TOKEN:?SONAR_TOKEN is required for the main-branch quality gate}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          mvn --batch-mode --no-transfer-progress sonar:sonar \
            -Dsonar.projectKey="$repo_name" \
            -Dsonar.projectName="$repo_name" \
            -Dsonar.qualitygate.wait=true

      - name: Upload verified showcase site
        uses: actions/upload-artifact@v4
        with:
          name: showcase-pages
          path: showcase-site/target/pages
          if-no-files-found: error
          retention-days: 7
