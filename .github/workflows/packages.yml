name: Maven Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish library reactor
    runs-on: [self-hosted, instanto-container]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure package access
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          echo "PACKAGES_READ_TOKEN=$PACKAGES_READ_TOKEN" >> "$GITHUB_ENV"
          python3 - <<'PYSET'
          from pathlib import Path
          p = Path.home() / '.m2/settings.xml'
          s = p.read_text()
          s = s.replace('</servers>', '<server><id>forgejo</id><username>${env.FORGEJO_PACKAGE_USER}</username><password>${env.FORGEJO_PACKAGE_TOKEN}</password></server></servers>')
          p.write_text(s)
          PYSET

      - name: Publish parent and library snapshots
        run: mvn -B -DskipTests -pl widget-processor,gwt/gwt-bootstrap3,gwt/gwt-bootstrap3-extras,gwt/gwt-bootstrap3-themes,gwt/gwt-bootstrap5,gwt/gwt-bootstrap5-extras,gwt/gwt-bootstrap5-themes,testing/bootstrap-widget-contracts,teavm/teavm-gwt-compat,teavm/teavm-bootstrap3,teavm/teavm-bootstrap5 -am deploy
        env:
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
