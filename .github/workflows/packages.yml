name: Maven Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bootstrap-widgets-snapshots
  cancel-in-progress: false

jobs:
  publish:
    name: Publish library reactor
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish parent and library snapshots
      goals: deploy
      maven-args: -pl widget-processor,gwt/gwt-bootstrap3,gwt/gwt-bootstrap3-extras,gwt/gwt-bootstrap3-themes,gwt/gwt-bootstrap5,gwt/gwt-bootstrap5-extras,gwt/gwt-bootstrap5-themes,testing/bootstrap-widget-contracts,teavm/teavm-gwt-compat,teavm/teavm-bootstrap3,teavm/teavm-bootstrap5 -am
      fast-deploy: true
      downstream-checks: false
      sonar: false
      timeout-minutes: 30
    secrets: inherit
