name: Maven Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish library reactor
    runs-on: [self-hosted, instanto-container]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java and GitHub Packages authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check out the shared development parent
        uses: actions/checkout@v4
        with:
          repository: instanto-io/instanto-poms
          path: .build/instanto-poms
      - name: Install the shared development parent
        run: mvn -B -ntp -f .build/instanto-poms/pom.xml install
      - name: Check out the development compatibility libraries
        uses: actions/checkout@v4
        with:
          repository: instanto-io/teavm-compat
          path: .build/teavm-compat
      - name: Install the development compatibility libraries
        run: mvn -B -ntp -f .build/teavm-compat/pom.xml -DskipTests install
      - name: Configure compatibility package access
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "PACKAGES_READ_TOKEN=$PACKAGES_READ_TOKEN" >> "$GITHUB_ENV"
          python3 - <<'PYSET'
          from pathlib import Path
          p = Path.home() / '.m2/settings.xml'
          s = p.read_text()
          s = s.replace('</servers>', '<server><id>github-teavm-compat</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server></servers>')
          p.write_text(s)
          PYSET

      - name: Publish parent and library modules
        run: mvn -B -DskipTests -pl widget-processor,gwt/gwt-bootstrap3,gwt/gwt-bootstrap3-extras,gwt/gwt-bootstrap3-themes,gwt/gwt-bootstrap5,gwt/gwt-bootstrap5-extras,gwt/gwt-bootstrap5-themes,testing/bootstrap-widget-contracts,teavm/teavm-gwt-compat,teavm/teavm-bootstrap3,teavm/teavm-bootstrap5 -am deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
