name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  packages: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: OWASP dependency audit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, instanto-container]
    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Maven for private package repositories
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>forgejo-instanto</id>
                <username>${env.FORGEJO_PACKAGE_USER}</username>
                <password>${env.FORGEJO_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-teavm-compat</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_READ_TOKEN}</password>
              </server>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-cucumber-tea</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-gherkin-tea</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-mockatcha</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run dependency audit
        run: mvn -B -Pdependency-audit -Dmaven.test.skip=true -DskipTests -DnvdApiKey="${NVD_API_KEY}" verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Maven properties are not populated automatically from environment variables.
        # settings.xml may supply nvdApiKey; otherwise pass the repository secret explicitly.

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: '**/target/dependency-check-report.*'
          if-no-files-found: warn
          retention-days: 30
