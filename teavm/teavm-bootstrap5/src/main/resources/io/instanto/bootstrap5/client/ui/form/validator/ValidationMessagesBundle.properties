# Default validation messages. Keys are the ValidationMessages method names, which is
# what ConstantsWithLookup.getString() resolves against.
#
# To add a language, copy this file to ValidationMessagesBundle_<lang>.properties and add
# its base name to META-INF/services/java.util.ResourceBundle.

org_gwtbootstrap5_validation_Blank_message=Field cannot be blank
org_gwtbootstrap5_validation_DecimalMax_message=Value must be less than or equal to {1}
org_gwtbootstrap5_validation_DecimalMin_message=Value must be greater than or equal to {1}
org_gwtbootstrap5_validation_FieldMatch_message={1} do not match
org_gwtbootstrap5_validation_Future_message=Value must be in the future
org_gwtbootstrap5_validation_Past_message=Value must be in the past
org_gwtbootstrap5_validation_RegEx_message=Must match regex
org_gwtbootstrap5_validation_Size_message=Size must be between {1} and {2}
